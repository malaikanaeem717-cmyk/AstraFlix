<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AstraFlix — AI-powered movie recommendations, chat with Astra, and a Netflix-inspired browsing experience.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AstraFlix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AstraFlix — AI Movie Recommendations</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background:#0A0A0A; height:100%; margin:0; }
    #splash-loading {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#0A0A0A; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    #splash-loading .dot { width:8px; height:8px; margin:0 4px; border-radius:50%;
      background:#E50914; display:inline-block; animation: pulse 1s infinite ease-in-out; }
    #splash-loading .dot:nth-child(2){ animation-delay:.15s; }
    #splash-loading .dot:nth-child(3){ animation-delay:.3s; }
    @keyframes pulse { 0%,80%,100%{ transform:scale(0.6); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }
  </style>
</head>
<body>
  <div id="splash-loading">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
